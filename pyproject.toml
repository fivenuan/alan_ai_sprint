[project]
name = "alan-ai-sprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alan", email = "2950127768@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
alan-ai-sprint = "alan_ai_sprint:main"
parse-json = "alan_ai_sprint.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
# RUF001/002/003 误报中文全角标点，对中文注释/文档不适用
extend-ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
