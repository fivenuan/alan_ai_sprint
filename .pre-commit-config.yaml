# Day 1 · Pre-commit hooks
# 这些 hook 在每次 commit 前自动跑 ruff + mypy + pytest，确保代码符合工程标准。

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy 用 local hook 走项目 venv：
  # mirrors-mypy 的独立环境看不到 pydantic 等项目依赖，会误报
  # "Class cannot subclass BaseModel (has type Any)"。
  # 用 .venv 里的 python 相对路径调用，不依赖系统 PATH。
  # （Windows 是 .venv/Scripts/，Linux/macOS 应改为 .venv/bin/python）
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: .venv/Scripts/python.exe -m mypy src tests
        language: system
        pass_filenames: false
        always_run: true